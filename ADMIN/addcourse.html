<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add New Course</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <style>
        .bg-primary {
            background-color: #EE1C25;
        }
        .text-primary {
            color: #EE1C25;
        }
        .bg-secondary {
            background-color: #0065BD;
        }
        .text-secondary {
            color: #0065BD;
        }
        .btn-primary {
            background-color: #EE1C25;
        }
        .btn-primary:hover {
            background-color: #d81c21;
        }
    </style>
</head>
<body class="bg-gray-100 bg-cover bg-center bg-gradient-to-r from-purple-400 via-pink-500 to-red-500" style="background-image: url('https://t4.ftcdn.net/jpg/05/12/20/21/360_F_512202172_jfpZFlxHVmbpgzj53AfESns0UBrIv2Wd.jpg');">
    <header class="bg-primary text-white p-4">
        <h1 class="text-2xl">Add New Course</h1>
    </header>
    <main class="p-6">
        <div class="max-w-4xl mx-auto bg-white shadow-md rounded-lg p-6">
            <h2 class="text-secondary text-xl mb-6 text-center">Create a New Course</h2>
            <form action="#" method="POST">
                <!-- Image Upload -->
                <div class="mb-4">
                    <label for="image" class="block text-gray-700 text-sm font-medium mb-2">Upload Course Image</label>
                    <input type="file" id="image" name="image" class="w-full px-4 py-2 border rounded-lg border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>

                <!-- Title -->
                <div class="mb-4">
                    <label for="title" class="block text-gray-700 text-sm font-medium mb-2">Course Title</label>
                    <input type="text" id="title" name="title" placeholder="Enter course title" class="w-full px-4 py-2 border rounded-lg border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>

                <!-- Description -->
                <div class="mb-4">
                    <label for="description" class="block text-gray-700 text-sm font-medium mb-2">Course Description</label>
                    <textarea id="description" name="description" rows="4" placeholder="Enter a brief course description..." class="w-full px-4 py-2 border rounded-lg border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary"></textarea>
                </div>

                <!-- Price -->
                <div class="mb-4">
                    <label for="price" class="block text-gray-700 text-sm font-medium mb-2">Course Price</label>
                    <input type="number" id="price" name="price" placeholder="Enter course price" class="w-full px-4 py-2 border rounded-lg border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>

                <!-- Syllabus Link -->
                <div class="mb-6">
                    <label for="syllabus" class="block text-gray-700 text-sm font-medium mb-2">Course Syllabus Link</label>
                    <input type="url" id="syllabus" name="syllabus" placeholder="Enter the syllabus link" class="w-full px-4 py-2 border rounded-lg border-gray-300 focus:outline-none focus:ring-2 focus:ring-primary">
                </div>

                <!-- Submit Button -->
                <div class="text-center">
                    <button type="submit" class="btn-primary text-white py-2 px-6 rounded-lg text-lg hover:bg-red-600 focus:ring-2 focus:ring-red-400 transition duration-300">Submit Course</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
