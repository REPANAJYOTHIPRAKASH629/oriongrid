<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Employee</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 bg-cover bg-center bg-gradient-to-r from-purple-400 via-pink-500 to-red-500" style="background-image: url('https://t4.ftcdn.net/jpg/05/12/20/21/360_F_512202172_jfpZFlxHVmbpgzj53AfESns0UBrIv2Wd.jpg');">
    <header class="bg-[#EE1C25] text-white p-4">
        <h1 class="text-2xl">Add New Employee</h1>
    </header>
    <!-- Container -->
    <div class="flex justify-center items-center min-h-screen">

        <!-- Form Card -->
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h2 class="text-2xl font-semibold text-center text-gray-700 mb-6">Add New Employee</h2>

            <!-- Form -->
            <form action="#" method="POST">
                <!-- Name Input -->
                <div class="mb-4">
                    <label for="name" class="block text-gray-600 mb-2">Employee Name</label>
                    <input type="text" id="name" name="name" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter employee name" required>
                </div>

                <!-- Email Input -->
                <div class="mb-4">
                    <label for="email" class="block text-gray-600 mb-2">Employee Email</label>
                    <input type="email" id="email" name="email" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Enter employee email" required>
                </div>

                <!-- Position Dropdown -->
                <div class="mb-4">
                    <label for="position" class="block text-gray-600 mb-2">Employee Position</label>
                    <select id="position" name="position" class="w-full p-3 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500" required>
                        <option value="" disabled selected>Select employee position</option>
                        <option value="Manager">Manager</option>
                        <option value="Developer">Developer</option>
                        <option value="Designer">Designer</option>
                        <option value="HR">HR</option>
                        <option value="Sales">Sales</option>
                    </select>
                </div>

                <!-- Submit Button -->
                <div class="flex justify-center mt-6">
                    <button type="submit" class="bg-blue-500 text-white px-6 py-3 rounded-md text-lg hover:bg-blue-600 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-opacity-50">Add Employee</button>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
